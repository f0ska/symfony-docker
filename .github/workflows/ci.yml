name: CI

on:
    push:
    pull_request:

jobs:
    validate:
        name: Validate scripts
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Validate scripts
              run: |
                  sh -n setup
                  sh -n docker/config/php/entrypoint.sh
                  bash -n composer console symfony install

    docker:
        name: Symfony ${{ matrix.symfony }} / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                symfony: ['6.4', '7.4', '8.0']
                php: [minimum, latest]

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Configure Symfony ${{ matrix.symfony }} with PHP ${{ matrix.php }}
              run: ./setup --version "${{ matrix.symfony }}" --php "${{ matrix.php }}"

            - name: Validate Compose configuration
              run: docker compose config >/dev/null

            - name: Build containers
              run: docker compose build

            - name: Start containers
              run: docker compose up -d

            - name: Wait for Symfony installation
              run: |
                  set -eu

                  for i in $(seq 1 90); do
                      test -f project/bin/console && exit 0
                      sleep 2
                  done

                  exit 1

            - name: Verify Symfony console
              run: |
                  test -f project/composer.json
                  test -f project/bin/console
                  docker compose exec -T -u project php sh -lc 'exec "${SYMFONY_APP_DIR:-project}/bin/console" about'

            - name: Verify HTTP response
              run: |
                  set -eu

                  http_status=000
                  for i in $(seq 1 90); do
                      http_status=$(curl -sS -o /tmp/symfony-http-body -w '%{http_code}' http://127.0.0.1:8880/ || true)
                      if [ "$http_status" != "000" ] && [ "$http_status" -lt 500 ]; then
                          exit 0
                      fi
                      sleep 2
                  done

                  printf 'Unexpected HTTP status: %s\n' "$http_status"
                  cat /tmp/symfony-http-body || true
                  exit 1

            - name: Show container logs
              if: failure()
              run: docker compose logs

            - name: Stop containers
              if: always()
              run: docker compose down -v --remove-orphans
